name: Frontend CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: edupulse-app/package-lock.json

      - name: Install dependencies
        working-directory: edupulse-app
        run: npm ci

      - name: Lint
        working-directory: edupulse-app
        run: npm run lint

      - name: Typecheck
        working-directory: edupulse-app
        run: npm run typecheck

      - name: Production build
        working-directory: edupulse-app
        run: npm run build
