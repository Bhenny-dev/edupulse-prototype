name: EduPulse verification

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: edupulse-app/package-lock.json

      - name: Install dependencies
        working-directory: edupulse-app
        run: npm ci

      - name: Lint, typecheck, tests, build and deployment validation
        working-directory: edupulse-app
        run: npm run verify

      - name: Dependency audit
        working-directory: edupulse-app
        run: npm audit --audit-level=high

      - name: Install browser for UI validation
        working-directory: edupulse-app
        run: npx playwright install --with-deps chromium

      - name: Desktop and mobile workflow checks
        working-directory: edupulse-app
        run: npm run test:browser
