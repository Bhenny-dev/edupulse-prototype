<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduPulse - AI-Driven Learning Management</title>
    <meta name="description" content="EduPulse is the College of Information Technology's AI-assisted syllabus, courseware and performance system at King's College of the Philippines: one shared home for syllabi, courseware and scores." />
    <meta name="theme-color" content="#2563eb" />
    <!-- What the first paint shows while the page's scripts arrive: the name on the page's own blue-white. React replaces it. -->
    <style>
      .boot { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px; background: #f3f8ff; color: #0f172a; font: 800 clamp(1.75rem, 5vw, 2.5rem) / 1 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; letter-spacing: -0.03em; }
      .boot-mark { width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(150deg, #3b82f6, #1d4ed8); box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.3), 0 10px 24px -12px rgb(29 78 216 / 0.7); }
      @media (prefers-color-scheme: dark) { .boot { background: #0f172a; color: #e8efff; } }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The fonts are requested by src/main.jsx once the page is on its way, so the stylesheet never holds up the first paint. -->
    <noscript><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&family=Patrick+Hand&family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" /></noscript>
  </head>
  <body>
    <div id="root"><div class="boot"><span class="boot-mark" aria-hidden="true"></span><span>EduPulse</span></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
